<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Espace Client</title>
    <!-- Google Material Symbols (Icônes) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <!-- CSS Principal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            
            <!-- En-tête de la carte -->
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="material-symbols-rounded">lock</span>
                </div>
                <h1 class="auth-title" data-i18n="auth_welcome_title">Bienvenue !</h1>
                <p class="auth-subtitle" data-i18n="auth_login_subtitle">Veuillez saisir vos identifiants pour accéder à votre espace</p>
            </div>

            <!-- Formulaire de connexion -->
            <form class="auth-form" id="loginForm" autocomplete="on">
                
                <!-- Champ Adresse Email -->
                <div class="form-group">
                    <label for="email" class="form-label" data-i18n="label_email_auth">Adresse e-mail</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">mail</span>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="nom@exemple.com" 
                            required 
                            autocomplete="email"
                        >
                    </div>
                </div>

                <!-- Champ Mot de passe -->
                <div class="form-group">
                    <label for="password" class="form-label" data-i18n="label_password_auth">Mot de passe</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">lock</span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="••••••••" 
                            required 
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Afficher/Masquer le mot de passe">
                            <span class="material-symbols-rounded" id="eyeIcon">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Options : Se souvenir de moi & Mot de passe oublié -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span data-i18n="remember_me">Se souvenir de moi</span>
                    </label>
                    <a href="#" class="forgot-link" data-i18n="forgot_password">Mot de passe oublié ?</a>
                </div>

                <!-- Bouton de soumission -->
                <button type="submit" class="btn-primary btn-submit" id="submitBtn">
                    <span data-i18n="btn_login">Se connecter</span>
                    <span class="material-symbols-rounded">arrow_forward</span>
                </button>

            </form>

            <!-- Pied de page / Inscription -->
            <div class="auth-footer">
                <span data-i18n="auth_no_account">Vous n'avez pas encore de compte ?</span> <a href="inscription.html" data-i18n="auth_create_account">Créer un compte</a>
            </div>

        </div>
    </div>

    <!-- Le fichier JS qui sera géré par Ismael pour le fonctionnement du formulaire s -->
    <script src="translation.js"></script>
    <script src="script.js"></script>
</body>
</html>
