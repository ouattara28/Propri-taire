<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CitéPay - Inscription Propriétaire</title>
    <!-- Lien vers le fichier CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="material-symbols-rounded">person_add</span>
                </div>
                <h1 class="auth-title" data-i18n="auth_create_account">Créer un compte</h1>
                <p class="auth-subtitle" data-i18n="auth_register_subtitle">Rejoignez CitéPay en tant que propriétaire</p>
            </div>

            <!-- Formulaire d'inscription -->
            <form class="auth-form" action="traitement-inscription.php" method="POST">
                <div class="form-group">
                    <label class="form-label" data-i18n="label_fullname">Nom complet</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">badge</span>
                        <input type="text" class="form-input" placeholder="Votre nom" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="label_email_auth">Adresse email</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">mail</span>
                        <input type="email" class="form-input" placeholder="votre@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="label_password_auth">Mot de passe</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">lock</span>
                        <input type="password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-submit" data-i18n="btn_register">S'inscrire</button>
            </form>

            <div class="auth-footer">
                <span data-i18n="auth_have_account">Vous avez déjà un compte ?</span> <a href="connexion.html" data-i18n="auth_login_link">Connectez-vous</a>
            </div>
        </div>
    </div>
<script src="translation.js"></script>
<script src="script.js" defer></script>
</body>
</html>
